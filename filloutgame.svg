<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Grid of lights out / flip tiles -->
  <g transform="translate(180, 50)">
    <!-- Row 0 -->
    <rect x="0" y="0" width="80" height="80" rx="12" fill="#334155" stroke="#475569" stroke-width="2" />
    <rect x="90" y="0" width="80" height="80" rx="12" fill="#10b981" filter="url(#glow)" />
    <rect x="180" y="0" width="80" height="80" rx="12" fill="#334155" stroke="#475569" stroke-width="2" />
    <rect x="270" y="0" width="80" height="80" rx="12" fill="#10b981" filter="url(#glow)" />
    <rect x="360" y="0" width="80" height="80" rx="12" fill="#334155" stroke="#475569" stroke-width="2" />

    <!-- Row 1 -->
    <rect x="0" y="90" width="80" height="80" rx="12" fill="#10b981" filter="url(#glow)" />
    <rect x="90" y="90" width="80" height="80" rx="12" fill="#10b981" filter="url(#glow)" />
    <rect x="180" y="90" width="80" height="80" rx="12" fill="#334155" stroke="#475569" stroke-width="2" />
    <rect x="270" y="90" width="80" height="80" rx="12" fill="#10b981" filter="url(#glow)" />
    <rect x="360" y="90" width="80" height="80" rx="12" fill="#10b981" filter="url(#glow)" />

    <!-- Row 2 (Center active click) -->
    <rect x="0" y="180" width="80" height="80" rx="12" fill="#334155" stroke="#475569" stroke-width="2" />
    <rect x="90" y="180" width="80" height="80" rx="12" fill="#334155" stroke="#475569" stroke-width="2" />
    <rect x="180" y="180" width="80" height="80" rx="12" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="220" cy="220" r="16" fill="#ffffff" opacity="0.9" />
    <rect x="270" y="180" width="80" height="80" rx="12" fill="#334155" stroke="#475569" stroke-width="2" />
    <rect x="360" y="180" width="80" height="80" rx="12" fill="#334155" stroke="#475569" stroke-width="2" />

    <!-- Row 3 -->
    <rect x="0" y="270" width="80" height="80" rx="12" fill="#10b981" filter="url(#glow)" />
    <rect x="90" y="270" width="80" height="80" rx="12" fill="#10b981" filter="url(#glow)" />
    <rect x="180" y="270" width="80" height="80" rx="12" fill="#334155" stroke="#475569" stroke-width="2" />
    <rect x="270" y="270" width="80" height="80" rx="12" fill="#10b981" filter="url(#glow)" />
    <rect x="360" y="270" width="80" height="80" rx="12" fill="#10b981" filter="url(#glow)" />
  </g>

  <!-- Title overlay -->
  <text x="400" y="415" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700" fill="#f8fafc" letter-spacing="1">反転パズル (完全解析ソルバー搭載)</text>
</svg>
